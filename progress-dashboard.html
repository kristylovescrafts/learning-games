<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids' Progress</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2140;--soft:#6a5f86;--bg:#f4f2fb;--card:#fff;--line:#ece7f6;
    --good:#22b36b;--good-bg:#e3f7ec;--mid:#f2a431;--mid-bg:#fdf1dc;--low:#e8503b;--low-bg:#fde5e1;--none:#c9c2dd;
    --disp:'Fredoka',system-ui,sans-serif;--body:'Nunito',system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);
    background-image:radial-gradient(circle at 100% 0,#efeaff 0,transparent 40%);-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
  h1,h2,h3{font-family:var(--disp);margin:0;line-height:1.15}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .top h1{font-size:1.7rem}
  .top h1 .q{color:#7c5cff}
  .updated{font-weight:800;color:var(--soft);font-size:.85rem}
  .sub{font-weight:800;color:var(--soft);font-size:.9rem;margin-bottom:16px}
  button{font-family:var(--disp);cursor:pointer;border:none}
  .btn{background:#7c5cff;color:#fff;border-radius:14px;font-weight:600;font-size:.95rem;padding:10px 16px;box-shadow:0 4px 0 #5f45cc}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5f45cc}
  .btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
  .btn.ghost:active{box-shadow:0 1px 0 var(--line)}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .daybar{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
  .daychip{font-family:var(--disp,sans-serif);font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:999px;border:none;cursor:pointer;background:#efeaff;color:#5f45cc}
  .daychip.on{background:#7c5cff;color:#fff}
  .kidcard{background:var(--card);border-radius:22px;box-shadow:0 4px 0 var(--line),0 12px 30px rgba(43,33,64,.06);padding:18px;margin-bottom:18px}
  .kidhead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .kidhead .ava{font-size:2.4rem;line-height:1}
  .kidhead .nm{font-family:var(--disp);font-weight:700;font-size:1.4rem}
  .kidhead .meta{font-weight:800;color:var(--soft);font-size:.82rem}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
  .chip{font-weight:800;font-size:.8rem;padding:4px 10px;border-radius:999px;background:#f3f0fb;color:var(--soft)}
  .chip b{color:var(--ink)}
  .legend{margin:6px 0 2px;font-weight:700;font-size:.78rem;color:var(--soft);background:#f7f5fd;border-radius:10px;padding:7px 10px;line-height:1.35}
  .legend b{color:var(--ink)}
  .group{font-family:var(--disp);font-weight:700;color:var(--soft);font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;margin:16px 0 6px}
  .lv{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .lv:first-of-type{border-top:none}
  .lv .ico{font-size:1.5rem;width:30px;text-align:center;flex:none}
  .lv .body{flex:1;min-width:0}
  .lv .nm{font-family:var(--disp);font-weight:600;font-size:1.02rem}
  .lv .det{font-weight:800;color:var(--soft);font-size:.8rem;margin-top:1px}
  .lv .miss{font-weight:800;color:var(--low);font-size:.78rem;margin-top:2px}
  .lv .miss span{background:var(--low-bg);border-radius:6px;padding:0 5px;margin-right:4px;display:inline-block}
  .lv.explore .nm{color:var(--soft)}
  .badge{flex:none;font-weight:900;font-size:.82rem;padding:5px 11px;border-radius:999px;text-align:center;min-width:66px}
  .badge.good{background:var(--good-bg);color:var(--good)}
  .badge.mid{background:var(--mid-bg);color:#a86f00}
  .badge.low{background:var(--low-bg);color:var(--low)}
  .badge.none{background:#f1eef9;color:var(--none)}
  .badge.expl{background:#eafaf4;color:#12967f}
  .bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
  .bar>i{display:block;height:100%;border-radius:6px}
  .empty{font-weight:800;color:var(--soft);text-align:center;padding:8px 0}
  .not-tried-note{font-weight:800;color:var(--soft);font-size:.82rem;margin-top:12px;background:#f7f5fd;border-radius:12px;padding:9px 12px}
  .sessions{margin-top:12px}
  .sessions summary{font-family:var(--disp);font-weight:600;color:var(--soft);cursor:pointer;font-size:.9rem}
  .srow{font-weight:800;color:var(--soft);font-size:.8rem;padding:4px 0 4px 6px}
  .banner{background:#fff;border-radius:16px;box-shadow:0 4px 0 var(--line);padding:14px 16px;margin-bottom:16px;font-weight:800;color:var(--soft);font-size:.9rem;line-height:1.5}
  .banner b{color:var(--ink)}
  .apptag{display:inline-flex;align-items:center;gap:6px;background:#efeaff;color:#5f45cc;font-family:var(--disp);font-weight:700;
    font-size:.9rem;padding:5px 12px;border-radius:999px;margin:22px 0 10px}
  .device-tag{font-weight:800;color:var(--soft);font-size:.78rem}
  .trend{background:var(--card);border-radius:18px;box-shadow:0 3px 0 var(--line);padding:14px 16px;margin-bottom:14px}
  .trendhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .trendhead .tava{font-size:1.4rem}
  .trendhead .tnm{font-family:var(--disp);font-weight:700;font-size:1.05rem}
  .trendhead .up{color:var(--good);font-weight:800;font-size:.82rem;background:var(--good-bg);padding:3px 9px;border-radius:999px}
  .trendhead .down{color:var(--low);font-weight:800;font-size:.82rem;background:var(--low-bg);padding:3px 9px;border-radius:999px}
  .trendhead .flat{color:var(--soft);font-weight:800;font-size:.82rem;background:#f1eef9;padding:3px 9px;border-radius:999px}
  .spark{margin:2px 0}
  .chart{position:relative;width:100%}
  .chart .cline{position:absolute;inset:0;width:100%;height:100%}
  .chart .cdot{position:absolute;width:8px;height:8px;border-radius:50%;background:#7c5cff;transform:translate(-50%,-50%)}
  .chart .clab{position:absolute;font-weight:800;font-size:.82rem;color:#a99fc4}
  .chart .clab.lstart{left:2px;top:2px}
  .chart .clab.lend{right:2px;top:2px;color:#7c5cff}
  .chart .clab.l80{right:2px;font-size:.62rem;color:#8fd6b0}

  

  .nodata{color:var(--soft);font-weight:700;font-size:.82rem;padding:8px 0}
  .log{margin-top:8px}
  .log summary{font-family:var(--disp);font-weight:600;color:var(--soft);cursor:pointer;font-size:.88rem}
  .logrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-weight:800;font-size:.84rem}
  .logrow:first-of-type{border-top:none;margin-top:6px}
  .logdate{min-width:58px;color:var(--ink)}
  .logbadge{font-weight:900;font-size:.78rem;padding:3px 9px;border-radius:999px;min-width:48px;text-align:center}
  .logbadge.good{background:var(--good-bg);color:var(--good)}
  .logbadge.mid{background:var(--mid-bg);color:#a86f00}
  .logbadge.low{background:var(--low-bg);color:var(--low)}
  .logbadge.none{background:#f1eef9;color:var(--none)}
  .logmeta{color:var(--soft)}
  input[type=file]{display:none}

  /* passcode gate */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:20px}
  #gate h2{font-family:var(--disp);font-size:1.5rem;margin:0 0 4px}
  #gate p{font-weight:800;color:var(--soft);margin:0 0 18px}
  .gdots{display:flex;gap:14px;margin:6px 0 14px}
  .gdot{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #ccc}
  .gdot.on{background:#7c5cff;border-color:#7c5cff}
  .gpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
  .gkey{font-family:var(--disp);font-weight:600;font-size:1.6rem;padding:14px 0;border-radius:16px;background:#fff;border:none;box-shadow:0 5px 0 var(--line);cursor:pointer}
  .gkey.blank{background:transparent;box-shadow:none}
  #gerr{color:#e8503b;font-weight:800;min-height:22px;margin-top:10px}
</style>
</head>
<body>
<div id="gate">
  <div style="font-size:2.4rem">🔒</div>
  <h2>Grown-ups only</h2>
  <p>Enter the code to see progress</p>
  <div class="gdots" id="gdots"></div>
  <div class="gpad" id="gpad"></div>
  <div id="gerr"></div>
</div>
<div class="wrap">
  <div class="top">
    <h1>Kids' <span class="q">Progress</span></h1>
    <div class="updated" id="updated"></div>
  </div>
  <div class="sub" id="sub">Loading…</div>
  <div class="toolbar">
    <button class="btn" id="refresh">↻ Refresh</button>
    <button class="btn ghost" id="loadBtn">📂 Load a progress file</button>
    <button class="btn ghost" id="demoBtn">👁 See a sample</button>
    <input type="file" id="file" accept="application/json,.json">
  </div>
  <div id="content"></div>
</div>
<script>

/* ---- passcode gate (kid-lock, same code as the games) ---- */
const DASH_PIN="1921";
(function(){
  var entry="";
  var gate=document.getElementById('gate'), dots=document.getElementById('gdots'), pad=document.getElementById('gpad'), err=document.getElementById('gerr');
  if(sessionStorage.getItem('dashUnlocked')==='1'){ gate.style.display='none'; return; }
  function draw(){ dots.innerHTML=[0,1,2,3].map(function(i){return '<span class="gdot'+(i<entry.length?' on':'')+'"></span>';}).join(''); }
  ["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function(k){
    var b=document.createElement('button');
    if(!k){ b.className='gkey blank'; b.disabled=true; } else { b.className='gkey'; b.textContent=k; }
    b.onclick=function(){
      if(k==="⌫"){ entry=entry.slice(0,-1); draw(); return; }
      if(!k||entry.length>=4) return;
      entry+=k; draw();
      if(entry.length===4){
        if(entry===DASH_PIN){ try{sessionStorage.setItem('dashUnlocked','1');}catch(e){} gate.style.display='none'; }
        else { err.textContent="That's not the code — try again."; entry=""; setTimeout(draw,220); }
      }
    };
    pad.appendChild(b);
  });
  draw();
})();

/* ---------- level metadata for each app ---------- */
const META={
  twinWordQuest:{ title:"📖 Word Quest", order:[
    ["forest","🌲","Word Forest","Reading"],
    ["city","🔍","Word Detective City","Reading"],
    ["beach","🏖️","Sentence Builder Beach","Reading"],
    ["mountain","⛰️","Missing Letter Mountain","Spelling"],
    ["station","🚀","Spell It Space Station","Spelling"],
    ["castle","🏰","Final Word Castle","Everything"]
  ]},
  mathQuest:{ title:"🔢 Math Quest", order:[
    ["friendsChart","🔟","Friends of Ten Chart","Friends of Ten"],
    ["pairs","🌈","Rainbow Pairs","Friends of Ten"],
    ["triangle","🔺","Number Triangle","Friends of Ten"],
    ["equation","🟰","Build the Equation","Friends of Ten"],
    ["missing","🕵️","Missing Number Mission","Friends of Ten"],
    ["teensChart","🚀","Teen Numbers Chart","Teen Numbers"],
    ["teensSpeed","🛰️","Teen Speed","Teen Numbers"],
    ["doublesChart","🐉","Doubles Chart","Doubles"],
    ["doublesSpeed","💥","Doubles Speed","Doubles"],
    ["hundred","🧮","Hundred Chart Hops","Counting by Tens"],
    ["hopper","🐸","Ten Hopper","Counting by Tens"],
    ["quick","⚡","Quick Tens","Counting by Tens"],
    ["placeValue","🧱","Place-Value Playground","Explore (no score)"]
  ]}
};
const $=s=>document.querySelector(s);
const fmtDate=iso=>{ try{return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return'';} };
const fmtWhen=iso=>{ try{return new Date(iso).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(e){return'';} };

function band(pct){ return pct>=80?['good','Solid']:pct>=50?['mid','Getting it']:['low','Focus here']; }

function levelRow(m,L){
  const [id,ico,name,group]=m;
  if(id==='placeValue'){
    const n=L&&L.plays?L.plays:0;
    return `<div class="lv explore"><div class="ico">${ico}</div><div class="body">
      <div class="nm">${name}</div><div class="det">${n?`explored ${n} time${n===1?'':'s'} — it's a sandbox, no score`:'not tried yet'}</div></div>
      <div class="badge expl">${n?'explored':'—'}</div></div>`;
  }
  if(!L||!L.total){
    return `<div class="lv"><div class="ico">${ico}</div><div class="body">
      <div class="nm">${name}</div><div class="det">not tried yet</div></div>
      <div class="badge none">—</div></div>`;
  }
  const correct=L.correct||0, total=L.total||0, wrong=(L.wrong!=null?L.wrong:total-correct);
  const qs=(L.qs!=null&&L.qs>0)?L.qs:correct;
  const hasFT=(L.firstTry!=null && qs>0);
  const pct=hasFT?Math.round(L.firstTry/qs*100):Math.round(correct/total*100);
  const [cls,lbl]=band(pct);
  const barc=cls==='good'?'var(--good)':cls==='mid'?'var(--mid)':'var(--low)';
  const miss=Object.keys(L.missed||{}).map(k=>({k,n:L.missed[k]})).sort((a,b)=>b.n-a.n);
  return `<div class="lv"><div class="ico">${ico}</div><div class="body">
      <div class="nm">${name}</div>
      <div class="det">${hasFT
        ? `played ${L.plays||1}× · ${qs} question${qs===1?'':'s'} · <b>${L.firstTry} right first try</b>${wrong?` · ${wrong} retr${wrong===1?'y':'ies'}`:''}`
        : `played ${L.plays||1}× · ${correct} right, ${wrong} wrong`}${L.last?` · last ${fmtDate(L.last)}`:''}</div>
      <div class="bar"><i style="width:${pct}%;background:${barc}"></i></div>
      ${miss.length?`<div class="miss">missed: ${miss.map(x=>`<span>${x.k}${x.n>1?` ${x.n}×`:''}</span>`).join('')}</div>`:''}
    </div>
    <div class="badge ${cls}">${pct}%</div></div>`;
}

function kidCard(app,player){
  const meta=META[app]; if(!meta) return '';
  const levels=player.levels||{};
  let rows='', group='';
  meta.order.forEach(m=>{
    if(m[3]!==group){ group=m[3]; rows+=`<div class="group">${group}</div>`; }
    rows+=levelRow(m, levels[m[0]]);
  });
  const tried=meta.order.filter(m=>m[0]!=='placeValue' && levels[m[0]] && levels[m[0]].total);
  const notTried=meta.order.filter(m=>m[0]!=='placeValue' && (!levels[m[0]]||!levels[m[0]].total)).map(m=>m[2]);
  // hardest / strongest
  let extra='';
  const lvPct=L=>{const c=L.correct||0,t=L.total||0,q=(L.qs!=null&&L.qs>0)?L.qs:c;
    return (L.firstTry!=null&&q>0)?Math.round(L.firstTry/q*100):Math.round(c/t*100);};
  const solid=tried.filter(m=>levels[m[0]].total>=5).map(m=>({name:m[2],ico:m[1],pct:lvPct(levels[m[0]])}));
  if(solid.length){
    const hard=solid.slice().sort((a,b)=>a.pct-b.pct)[0], easy=solid.slice().sort((a,b)=>b.pct-a.pct)[0];
    extra=`<div class="chips"><span class="chip">💪 strongest: <b>${easy.ico} ${easy.name}</b></span>`+
      (hard.name!==easy.name?`<span class="chip">🎯 hardest: <b>${hard.ico} ${hard.name}</b></span>`:'')+`</div>`;
  }
  const anyFT=meta.order.some(m=>levels[m[0]]&&levels[m[0]].firstTry!=null);
  const legend=anyFT?`<div class="legend">Scores below are <b>first-try accuracy</b> — how often it was right without a second go.</div>`:'';
  const log=(player.log||[]).slice(-10).reverse();
  const sessions=log.length?`<details class="sessions"><summary>Recent sessions (${log.length})</summary>${
    log.map(e=>{const mm=meta.order.find(x=>x[0]===e.modeId||x[0]===e.mode); const nm=mm?`${mm[1]} ${mm[2]}`:(e.mode||e.modeId||'');
      const q=(e.qs!=null?e.qs:e.total); const ft=e.firstTry;
      const detail=e.explored?' · explored'
        :(ft!=null&&q)?` · ${ft}/${q} first try`
        :(e.correct!=null?` · ${e.correct} right${e.wrong!=null?`, ${e.wrong} wrong`:''}`:'');
      return `<div class="srow">${fmtWhen(e.at)} — ${nm}${detail}</div>`;}).join('')
  }</details>`:'';
  return `<div class="kidcard">
    <div class="kidhead"><div class="ava">${player.avatar||'🙂'}</div>
      <div><div class="nm">${player.name||'Player'}</div>
        <div class="meta">${tried.length?`${tried.length} level${tried.length===1?'':'s'} this day`:'no scored levels this day'}</div></div></div>
    ${extra}
    ${legend}
    ${rows}
    ${notTried.length?`<div class="not-tried-note">🚧 Hasn't tried yet: ${notTried.join(', ')}</div>`:''}
    ${sessions}
  </div>`;
}

let SELECTED_DAY = null;   // which day the dashboard is showing (null = latest)
function dayOf(s){ return s.day || (s.saved ? String(s.saved).slice(0,10) : ''); }

function render(snapshots){
  const box=$('#content');
  if(!snapshots||!snapshots.length){ box.innerHTML=`<div class="empty">No progress yet. Once the kids play, today's report shows up here.</div>`; $('#sub').textContent=''; return; }
  snapshots.sort((a,b)=>String(b.saved).localeCompare(String(a.saved)));
  window.__allSnaps=snapshots;

  // All days that have any data, newest first.
  const days=[...new Set(snapshots.map(dayOf).filter(Boolean))].sort().reverse();
  if(!SELECTED_DAY || days.indexOf(SELECTED_DAY)<0) SELECTED_DAY = days[0];
  const day = SELECTED_DAY;

  // For the selected day: newest report per (app + child).
  const seen={}; const perApp={};
  snapshots.forEach(s=>{
    if(dayOf(s)!==day || !s.players) return;
    ['thomas','tori'].forEach(k=>{
      const p=s.players[k]; if(!p) return;
      // skip a blank/empty twin that rode along on the other kid's report
      const hasData=(p.gems>0) || (p.levels && Object.keys(p.levels).length>0) || (p.log && p.log.length>0);
      if(!hasData) return;
      const key=s.app+'|'+k; if(seen[key]) return; seen[key]=1;
      (perApp[s.app]=perApp[s.app]||[]).push({snap:s,child:k});
    });
  });

  // Day picker
  let html = `<div class="daybar">` + days.map(dk=>
    `<button class="daychip${dk===day?' on':''}" data-day="${dk}">${dk===days[0]?'Today':fmtDate(dk)}</button>`
  ).join('') + `</div>`;

  if(!Object.keys(perApp).length){
    html += `<div class="empty">No activity on ${fmtDate(day)}.</div>`;
  } else {
    Object.keys(perApp).forEach(app=>{
      const meta=META[app]; html+=`<div class="apptag">${meta?meta.title:app}</div>`;
      perApp[app].forEach(entry=>{
        const s=entry.snap, k=entry.child;
        if(s.device) html+=`<div class="device-tag">from ${s.device} · ${fmtWhen(s.saved)}</div>`;
        html+=kidCard(app,s.players[k]);
      });
    });
  }
  box.innerHTML=html;
  wireLogs();
  // wire day chips
  box.querySelectorAll('.daychip').forEach(b=>b.onclick=()=>{ SELECTED_DAY=b.dataset.day; render(window.__allSnaps); });
  const newest=snapshots.map(s=>s.saved).sort().slice(-1)[0];
  $('#updated').textContent=newest?`Updated ${fmtWhen(newest)}`:'';
  $('#sub').textContent = day===days[0] ? `Showing today · ${days.length} day${days.length===1?'':'s'} on record.` : `Showing ${fmtDate(day)} · tap "Today" to return.`;
}

/* ---- build a per-day history for one child in one app ---- */
function dayKey(iso){ try{ return new Date(iso).toISOString().slice(0,10); }catch(e){ return String(iso).slice(0,10); } }
function totals(levels){ let c=0,t=0; for(const id in (levels||{})){ if(id==='placeValue')continue; const L=levels[id]; c+=L.correct||0; t+=L.total||0; } return {c,t}; }
function historyFor(app,key,snaps){
  // TRUE per-day breakdown: build from the session logs (each play is dated),
  // so each day shows only THAT day's questions — not a running lifetime total.
  const relevant=snaps.filter(s=>s.app===app && s.players && s.players[key]);
  if(!relevant.length) return {name:key,avatar:'🙂',days:[]};
  // gather every session log entry across all snapshots, de-duplicated by timestamp+mode
  const seen={}; const sessions=[];
  relevant.forEach(s=>{
    const p=s.players[key]; (p.log||[]).forEach(e=>{
      const id=e.modeId||e.mode; const at=e.at; if(!at) return;
      const sig=at+'|'+id; if(seen[sig]) return; seen[sig]=1;
      const correct=e.correct||0;
      const wrong=(e.wrong!=null)?e.wrong:((e.total!=null)?Math.max(0,e.total-correct):0);
      if(e.explored) return; // skip unscored sandbox plays
      sessions.push({at, day:dayKey(at), modeId:id, correct, wrong, total:correct+wrong});
    });
  });
  // gems per day = the max gems seen in any snapshot saved that day (cumulative, but fine as a daily "where they were")
  const gemsByDay={};
  relevant.forEach(s=>{ const g=s.players[key].gems||0; const dk=dayKey(s.saved);
    if(gemsByDay[dk]==null || g>gemsByDay[dk]) gemsByDay[dk]=g; });
  // bucket sessions by day
  const byDay={};
  sessions.forEach(x=>{ const d=byDay[x.day]||(byDay[x.day]={date:x.day,correct:0,total:0,modes:{},plays:0});
    d.correct+=x.correct; d.total+=x.total; d.plays++; d.modes[x.modeId]=(d.modes[x.modeId]||0)+1; });
  const days=Object.values(byDay).map(d=>({...d, gems:gemsByDay[d.date]||0,
    levelsPlayed:Object.keys(d.modes).length})).sort((a,b)=>a.date.localeCompare(b.date));
  const anyP=relevant.find(s=>s.players[key]).players[key];
  return { name:anyP.name||key, avatar:anyP.avatar||'🙂', days };
}

/* ---- the chart + daily log block ---- */
function trendBlock(app,key,hist){
  const meta=META[app];
  const pts=hist.days.map(d=>({date:d.date, pct: d.total? Math.round(d.correct/d.total*100):null, gems:d.gems, day:d}));
  const withPct=pts.filter(p=>p.pct!=null);
  const spark=sparkline(withPct.map(p=>p.pct));
  const first=withPct[0], last=withPct[withPct.length-1];
  let trend='';
  if(withPct.length>=2){
    const diff=last.pct-first.pct;
    trend = diff>2?`<span class="up">▲ up ${diff}% since ${fmtDate(first.date)}</span>`
          : diff<-2?`<span class="down">▼ down ${Math.abs(diff)}% since ${fmtDate(first.date)}</span>`
          : `<span class="flat">holding steady</span>`;
  }
  const rows=hist.days.slice().reverse().map(d=>{
    const pct=d.total?Math.round(d.correct/d.total*100):null;
    return `<div class="logrow"><span class="logdate">${fmtDate(d.date)}</span>
      <span class="logbadge ${pct==null?'none':band(pct)[0]}">${pct==null?'—':pct+'%'}</span>
      <span class="logmeta">${d.correct}/${d.total} right · ${d.levelsPlayed} level${d.levelsPlayed===1?'':'s'} that day</span></div>`;
  }).join('');
  return `<div class="trend">
    <div class="trendhead"><span class="tava">${hist.avatar}</span><span class="tnm">${hist.name} over time</span>${trend}</div>
    <div class="spark">${spark}</div>
    <details class="log"><summary>Daily log (${hist.days.length} day${hist.days.length===1?'':'s'})</summary>${rows}</details>
  </div>`;
}

/* ---- accuracy-over-time chart: full-width line, HTML labels overlaid ---- */
function sparkline(vals){
  if(!vals.length) return '<div class="nodata">Not enough days yet to chart</div>';
  const H=130,padT=26,padB=16;
  const yPct=v=>((padT+(1-v/100)*(H-padT-padB))/H*100);
  const first=vals[0], last=vals[vals.length-1];
  if(vals.length===1){
    return `<div class="chart" style="height:${H}px">
      <div class="cdot" style="left:50%;top:${yPct(vals[0])}%"></div>
      <div class="clab" style="left:50%;top:calc(${yPct(vals[0])}% - 20px);transform:translateX(-50%)">${vals[0]}%</div></div>`;
  }
  const n=vals.length;
  const xPct=i=>(i/(n-1))*100;
  // SVG path in a 0..100 x 0..100 box, stretched to fill
  const pts=vals.map((v,i)=>[xPct(i), (padT+(1-v/100)*(H-padT-padB))/H*100]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ');
  const area=`M0 100 `+pts.map(p=>'L'+p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' ')+' L100 100 Z';
  const g80=(padT+(1-80/100)*(H-padT-padB))/H*100;
  const dots=pts.map(p=>`<div class="cdot" style="left:${p[0]}%;top:${p[1]}%"></div>`).join('');
  return `<div class="chart" style="height:${H}px">
    <svg class="cline" viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%">
      <line x1="0" y1="${g80.toFixed(2)}" x2="100" y2="${g80.toFixed(2)}" stroke="#e3f7ec" stroke-width="0.5" vector-effect="non-scaling-stroke"/>
      <path d="${area}" fill="#efeaff"/>
      <path d="${line}" fill="none" stroke="#7c5cff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    </svg>
    ${dots}
    <div class="clab lstart">${first}%</div>
    <div class="clab lend">${last}%</div>
    <div class="clab l80" style="top:calc(${g80.toFixed(2)}% - 14px)">80%</div>
  </div>`;
}

/* ---------- data sources ---------- */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbxN-BmXkUg519oFxv8DGb6PfdAfNJfPC_FEaD42oaKCslSWOBqZakEGlVLipxAXxh3BOA/exec";
async function pull(){
  $('#sub').textContent='Checking for new results…';
  try{
    // Primary: Google Sheet (the reliable pipe). Falls back to the old Netlify function.
    const url = (SHEET_URL && SHEET_URL.indexOf('http')===0) ? SHEET_URL : '/.netlify/functions/get-progress';
    const res=await fetch(url,{headers:{'accept':'application/json'}});
    if(!res.ok) throw 0;
    const data=await res.json();
    const snaps=(data.snapshots||data||[]).filter(Boolean);
    if(snaps.length){ render(snaps); return; }
    $('#sub').innerHTML='No results have arrived yet. They appear here after the kids play and close the app.';
  }catch(e){
    $('#sub').innerHTML='Automatic sync isn\'t connected yet (that\'s the one-time Netlify step). You can still tap <b>Load a progress file</b> or <b>See a sample</b> below.';
    $('#content').innerHTML='';
  }
}
function loadFile(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const d=JSON.parse(fr.result);
    const snaps = Array.isArray(d)?d : (d.snapshots?d.snapshots : [d]);
    render(snaps); $('#sub').textContent='Loaded from file.';
  }catch(e){ $('#sub').textContent='That file could not be read.'; } };
  fr.readAsText(file);
}
