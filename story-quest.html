<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Story Quest</title>
<style>
:root{--ink:#16233f;--soft:#6b7794;--paper:#fdf8ee;--card:#fff;--gold:#f5a524;
  --leaf:#2f8f5b;--coral:#e0644f;--line:#e8e1d2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 70px}
h2{font-size:25px;margin:26px 0 6px;font-weight:800;letter-spacing:-.02em}
.lede{color:var(--soft);margin:0 0 20px}

.name{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);
  border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:12px;
  font:inherit;font-size:22px;font-weight:800;color:inherit;box-shadow:0 4px 0 var(--ink)}
.name:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

.shelf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pickset{padding:0;border:2px solid var(--ink);border-radius:16px;overflow:hidden;
  background:var(--card);cursor:pointer;box-shadow:0 4px 0 var(--ink);display:block}
.pickset:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pickset img{width:100%;display:block;aspect-ratio:1;object-fit:cover;background:#f1ede3}

.panel{margin:0 0 26px}
.panel .n{font-size:12px;font-weight:800;letter-spacing:.09em;color:var(--soft);margin-bottom:6px}
.panel img{width:100%;border-radius:16px;display:block;background:#f1ede3}
textarea{width:100%;font:inherit;font-size:19px;padding:14px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:inherit;
  min-height:80px;resize:none;margin-top:10px}
textarea:focus{outline:none;border-color:var(--ink)}
.mic{width:100%;font:inherit;font-weight:800;font-size:17px;cursor:pointer;border:0;
  border-radius:14px;background:var(--leaf);color:#fff;padding:15px;margin-top:9px;
  box-shadow:0 4px 0 #1d6b41}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6b41}
.mic.on{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #c07d10;animation:p 1.1s infinite}
.mic.blue{background:#3d7fd6;box-shadow:0 4px 0 #2a5c9c}
@keyframes p{50%{filter:brightness(1.18)}}

.next{width:100%;font:inherit;font-weight:800;font-size:19px;cursor:pointer;border:0;
  border-radius:18px;background:var(--leaf);color:#fff;padding:19px;box-shadow:0 4px 0 #1d6b41}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6b41}
.quiet{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;
  text-decoration:underline;cursor:pointer;padding:14px 0;display:block;margin:0 auto}
.home{display:block;width:fit-content;margin:22px auto 6px;padding:10px 18px;border-radius:999px;
  background:var(--card);border:2px solid var(--line);color:var(--soft);font-weight:800;
  font-size:14px;text-decoration:none}
.say{font-size:14px;color:var(--soft);margin-top:8px}
.oops{background:#fdeceb;border-radius:12px;padding:11px;font-size:14px;margin-top:9px}

.cover{background:var(--gold);border-radius:18px;padding:30px 20px;text-align:center;
  margin:20px 0 24px}
.cover h3{font-size:27px;margin:0 0 7px;font-weight:800}
.cover span{font-weight:700;color:#6b4a08}
.gu{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:11px}
.gu h4{margin:0 0 9px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.opt{display:flex;gap:7px}
.opt button{flex:1;font:inherit;font-weight:700;font-size:14px;padding:12px 6px;
  border:2px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--soft);cursor:pointer}
.opt button.on{border-color:var(--ink);background:var(--ink);color:#fff}

@media print{
  .mic,.next,.quiet,textarea,.say,button,.home{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}
  .panel{page-break-inside:avoid;margin-bottom:30px}
  .panel .n{display:none}
  .cover{page-break-after:always;background:none}
  .cap{font-size:22px;text-align:center;margin-top:12px}
}
</style>
</head>
<body>
<div class="wrap"><div id="screen"></div></div>

<script>
/* Pictures live in story-pictures/setNN-1.png ... setNN-4.png
   Nothing is generated at runtime. No API, no waiting. */
var DIR='story-pictures/';
var MAXSETS=100;

var S={}, sets=[];
var $=function(i){return document.getElementById(i);};
var el=$('screen');

function save(k,v){try{localStorage.setItem('sq_'+k,JSON.stringify(v));}catch(e){}}

/* ---------- send finished books to the grown-up dashboard ---------- */
var SHEET_URL='https://script.google.com/macros/s/AKfycbxN-BmXkUg519oFxv8DGb6PfdAfNJfPC_FEaD42oaKCslSWOBqZakEGlVLipxAXxh3BOA/exec';
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function deviceName(){ return load('device',''); }
function storyPayload(){
  var day=todayStr(), all=load('shelfBooks',[]), players={};
  all.forEach(function(b){
    if(!b.when) return;
    var d=new Date(b.when);
    var bd=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
    if(bd!==day) return;                                   // today's books only
    var k=String(b.who||'').toLowerCase();
    if(k!=='thomas' && k!=='tori') return;
    var pl=players[k]||(players[k]={name:b.who,avatar:k==='thomas'?'\uD83E\uDD8A':'\uD83E\uDD84',
      day:day,gems:0,levels:{},log:[],books:[]});
    pl.books.push({title:b.title||'',setN:b.setN||'',at:new Date(b.when).toISOString(),
      caps:(b.caps||[]).map(function(c){return String(c||'');})});
  });
  Object.keys(players).forEach(function(k){
    var pl=players[k];
    // the dashboard skips a child with no data at all, so give it something real
    pl.gems=pl.books.length;
    pl.log=pl.books.map(function(b){return {at:b.at,mode:'Story',modeId:'story',title:b.title};});
  });
  return JSON.stringify({app:'storyQuest',kind:'daily',day:day,saved:new Date().toISOString(),
    device:deviceName(),players:players});
}
function sendStories(){
  if(!SHEET_URL || SHEET_URL.indexOf('http')!==0) return;
  try{
    fetch(SHEET_URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({payload:storyPayload()}).toString()})
      .catch(function(){});   /* offline / no signal — the book is still saved locally */
  }catch(e){}
}
function load(k,d){try{var v=localStorage.getItem('sq_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
var HOME='<a class="home" href="/">\uD83C\uDFE0 All games</a>';
var HOME_ASK='<a class="home" href="/" onclick="return leaveStory()">\uD83C\uDFE0 All games</a>';
function leaveStory(){
  var typed=false;
  for(var i=0;i<4;i++){ var t=document.getElementById('t'+i); if(t&&t.value.trim()) typed=true; }
  if(S&&S.caps) S.caps.forEach(function(c){ if(String(c||'').trim()) typed=true; });
  return !typed || confirm('Leave this story? The writing so far will not be saved.');
}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pad(n){return (n<10?'0':'')+n;}

/* ---------- work out which sets are actually there ---------- */
function findSets(done){
  var found=[], checked=0;
  for(var n=1;n<=MAXSETS;n++){
    (function(n){
      tryExt(n,['png','jpg','jpeg'],0,function(ext){
        if(ext) found.push({n:n,ext:ext});
        if(++checked===MAXSETS){
          found.sort(function(a,b){return a.n-b.n;});
          done(found);
        }
      });
    })(n);
  }
}
function tryExt(n,list,i,cb){
  if(i>=list.length){ cb(null); return; }
  var img=new Image();
  img.onload=function(){ cb(list[i]); };
  img.onerror=function(){ tryExt(n,list,i+1,cb); };
  img.src=DIR+'set'+pad(n)+'-1.'+list[i];
}
function url(set,k){ return DIR+'set'+pad(set.n)+'-'+k+'.'+set.ext; }

/* ---------- listening ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null;
var on=false, heard='', fLive, fDone, fBad, micIdx=-1;
function canHear(){return !!SR;}
function hear(live,done,bad){
  if(!SR){bad('This device cannot listen.');return;}
  heard=''; on=true; fLive=live; fDone=done; fBad=bad; spin();
}
function spin(){
  try{
    rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
    rec.onresult=function(e){
      var mid='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal) heard+=(heard?' ':'')+t.trim(); else mid+=t;
      }
      if(fLive) fLive(heard+(mid?(heard?' ':'')+mid:''));
    };
    rec.onerror=function(e){
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        on=false; fBad('The microphone is switched off. Ask a grown-up.');
      }
    };
    rec.onend=function(){ if(on){setTimeout(function(){if(on)spin();},250);} else if(fDone) fDone(heard); };
    rec.start();
  }catch(err){ on=false; fBad('The microphone would not start.'); }
}
function halt(){ on=false; if(rec){try{rec.stop();}catch(e){}} }
function speak(t){try{speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.05;speechSynthesis.speak(u);}catch(e){}}

/* ============================================================ */
function boot(){
  el.innerHTML='<h2>Story Quest</h2><p class="lede">Finding your stories...</p>';
  findSets(function(f){
    sets=f;
    if(!sets.length){
      el.innerHTML='<h2>No pictures yet</h2>'+
        '<p class="lede">A grown-up needs to put the picture sets into the '+
        '<b>story-pictures</b> folder first.</p>'+
        '<p class="lede" style="font-size:14px">Expected file names: '+
        'story-pictures/set01-1.png through story-pictures/set01-4.png</p>'+HOME;
      return;
    }
    who();
  });
}

function who(){
  S={mode:load('mode', canHear()?'talk':'type')};
  el.innerHTML='<h2>Who is writing?</h2>'+
    '<button class="name" onclick="go(\'Thomas\')">&#128994; Thomas</button>'+
    '<button class="name" onclick="go(\'Tori\')">&#128311; Tori</button>'+
    '<button class="quiet" onclick="grown()">Grown-ups</button>'+HOME;
}
function go(w){ S.who=w; shelf(); }

function shelf(){
  el.innerHTML='<h2>Pick a story</h2>'+
    '<p class="lede">These pictures tell a story. You write the words.</p>'+
    '<div class="shelf">'+
      sets.map(function(s,i){
        return '<button class="pickset" onclick="start('+i+')">'+
          '<img src="'+url(s,1)+'" alt="" loading="lazy"></button>';
      }).join('')+
    '</div><button class="quiet" onclick="who()">Back</button>'+HOME;
}

function start(i){ S.set=sets[i]; S.caps=['','','','']; write(); }

function write(){
  var s=S.set;
  el.innerHTML=
    '<h2>What is happening?</h2>'+
    '<p class="lede">Write what happens in each picture.</p>'+
    [1,2,3,4].map(function(k){
      var i=k-1;
      return '<div class="panel">'+
        '<div class="n">PICTURE '+k+'</div>'+
        '<img src="'+url(s,k)+'" alt="">'+
        (S.mode==='talk'||S.mode==='spell'
          ? '<button class="mic" id="m'+i+'" onclick="mic('+i+')">&#127908; START talking</button>'
          : '')+
        '<div id="say'+i+'"></div>'+
        (S.mode==='spell' ? '<div id="sp'+i+'"></div>' : '')+
        '<textarea id="t'+i+'" placeholder="what is happening here?" '+
          'autocapitalize="off" autocorrect="off" spellcheck="false" '+
          'oninput="keep('+i+')">'+esc(S.caps[i])+'</textarea>'+
      '</div>';
    }).join('')+
    '<button class="next" onclick="finish()">My story is finished</button>'+
    '<button class="quiet" onclick="shelf()">Pick a different story</button>'+
    '<button class="quiet" onclick="grown()">Grown-ups</button>'+HOME_ASK;
}

function keep(i){ S.caps[i]=$('t'+i).value; }
function say(i,t,bad){ var s=$('say'+i); if(s) s.innerHTML=t?'<div class="'+(bad?'oops':'say')+'">'+t+'</div>':''; }

var base='';
function mic(i){
  var b=$('m'+i);
  if(on && micIdx===i){ halt(); return; }
  if(on){ halt(); }
  micIdx=i;
  b.classList.add('on'); b.innerHTML='&#9209;&#65039; STOP';

  if(S.mode==='spell'){
    say(i,'Say your sentence, then tap STOP.');
    hear(function(l){ var n=l.trim()?l.trim().split(/\s+/).length:0;
        say(i,'heard '+n+' word'+(n===1?'':'s')); },
      function(t){
        b.classList.remove('on'); b.innerHTML='&#127908; START talking';
        S.heardTxt=(t||'').trim();
        if(!S.heardTxt){ say(i,'I did not catch that.',1); return; }
        say(i,'');
        $('sp'+i).innerHTML='<button class="mic blue" onclick="speak(S.heardTxt)">'+
          '&#128266; play it again</button>';
        $('t'+i).focus();
        setTimeout(function(){speak(S.heardTxt);},300);
      },
      function(e){ b.classList.remove('on'); b.innerHTML='&#127908; START talking'; say(i,e,1); });
  } else {
    base=($('t'+i).value||'').trim();
    say(i,'Take as long as you like.');
    hear(function(l){ $('t'+i).value=(base?base+' ':'')+l; S.caps[i]=$('t'+i).value; },
      function(){ b.classList.remove('on'); b.innerHTML='&#127908; START talking'; say(i,''); },
      function(e){ b.classList.remove('on'); b.innerHTML='&#127908; START talking'; say(i,e,1); });
  }
}

function finish(){
  halt();
  for(var i=0;i<4;i++) if($('t'+i)) S.caps[i]=$('t'+i).value.trim();
  if(!S.caps.filter(function(c){return c;}).length){
    alert('Write something about the pictures first!'); return;
  }
  el.innerHTML='<h2>What is your book called?</h2>'+
    '<textarea id="ti" style="min-height:64px" placeholder="my book is called..." '+
      'autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>'+
    '<div id="say9"></div>'+
    '<button class="next" onclick="seal()">Finish it!</button>'+
    '<button class="quiet" onclick="write()">keep writing</button>'+HOME_ASK;
}

function seal(){
  var t=($('ti').value||'').trim();
  if(!t){ $('say9').innerHTML='<div class="oops">give it a title first</div>'; return; }
  S.title=t;
  var g=load('gems',0)+8; save('gems',g);
  var sh=load('shelfBooks',[]);
  sh.unshift({title:t,who:S.who,when:Date.now(),setN:S.set.n,ext:S.set.ext,caps:S.caps});
  save('shelfBooks',sh.slice(0,60));
  sendStories();
  book(g);
}

function book(g){
  var s=S.set;
  el.innerHTML='<div class="cover"><h3>'+esc(S.title)+'</h3>'+
    '<span>written by '+esc(S.who)+'</span></div>'+
    [1,2,3,4].map(function(k){
      return '<div class="panel"><img src="'+url(s,k)+'" alt="">'+
        '<p class="cap" style="font-size:18px;margin:10px 0 0">'+esc(S.caps[k-1])+'</p></div>';
    }).join('')+
    '<p style="text-align:center;font-weight:800">&#128142; '+g+' gems</p>'+
    '<button class="next" onclick="window.print()">&#128424; Print my book</button>'+
    '<button class="quiet" onclick="who()">write another</button>'+HOME;
  window.scrollTo(0,0);
}

function grown(){
  if(prompt('Grown-up code')!=='1921') return;
  var m=load('mode','talk'), sh=load('shelfBooks',[]);
  el.innerHTML='<h2>Grown-ups</h2>'+
    '<div class="gu"><h4>How they write</h4><div class="opt">'+
      '<button class="'+(m==='talk'?'on':'')+'" onclick="setMode(\'talk\')">Talk it</button>'+
      '<button class="'+(m==='spell'?'on':'')+'" onclick="setMode(\'spell\')">Say &amp; spell</button>'+
      '<button class="'+(m==='type'?'on':'')+'" onclick="setMode(\'type\')">Type it</button>'+
    '</div></div>'+
    '<div class="gu"><h4>Progress dashboard</h4>'+
      '<div style="font-size:14px;color:var(--soft)">Finished books are sent to the '+
      'grown-up dashboard so you can read what they wrote. Spelling is sent exactly as '+
      'they typed it.</div>'+
      '<button class="quiet" style="margin-top:6px" onclick="setDevice()">This iPad is called: '+
      (deviceName()||'(not set)')+'</button>'+
      '<button class="quiet" onclick="resend()">Re-send today\'s books</button>'+
    '</div>'+
    '<div class="gu"><h4>'+sets.length+' picture sets found</h4>'+
      '<div style="font-size:14px;color:var(--soft)">Add more by putting setNN-1 through '+
      'setNN-4 into the story-pictures folder.</div></div>'+
    '<div class="gu"><h4>'+sh.length+' book'+(sh.length===1?'':'s')+' saved</h4>'+
      sh.map(function(b,i){return '<button class="quiet" style="text-align:left;margin:0" '+
        'onclick="openBook('+i+')">'+esc(b.title)+' &middot; '+esc(b.who)+'</button>';}).join('')+
    '</div>'+
    '<button class="quiet" onclick="boot()">Back</button>'+HOME;
}
function setMode(m){ save('mode',m); S.mode=m; grown(); }
function setDevice(){ var n=prompt('What should this device be called?',deviceName()||'');
  if(n!==null){ save('device',n.trim()); grown(); } }
function resend(){ sendStories(); alert("Today's books have been sent."); }
function openBook(i){
  var b=load('shelfBooks',[])[i];
  S.title=b.title; S.who=b.who; S.caps=b.caps; S.set={n:b.setN,ext:b.ext||'png'};
  book(load('gems',0));
}

boot();
</script>
</body>
</html>
