<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Story Quest</title>
<style>
:root{
  --ink:#16233f; --soft:#6b7794; --paper:#fdf8ee; --card:#fff;
  --gold:#f5a524; --leaf:#2f8f5b; --coral:#e0644f; --line:#e8e1d2;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 70px}

/* pinned story prompt - one quiet line, always there */
.prompt{position:sticky;top:0;z-index:30;background:var(--paper);
  margin:0 -16px;padding:13px 16px 11px;border-bottom:1px solid var(--line);
  font-size:14px;color:var(--soft);cursor:pointer}
.prompt b{display:block;color:var(--ink);font-size:16px;font-weight:700;margin-top:1px}

/* the question - the only loud thing on the page */
.q{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.02em;
  margin:26px 0 16px;cursor:pointer}
.q em{font-style:normal;color:var(--soft);font-size:13px;font-weight:700;
  display:block;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}

/* pages */
.page{margin:0 0 20px}
.page p{font-size:18px;margin:0;white-space:pre-wrap}
.page img{width:100%;border-radius:14px;margin-top:9px;display:block;background:#f1ede3}
.page .redo{background:none;border:0;color:var(--soft);font:inherit;font-size:13px;
  text-decoration:underline;padding:6px 0 0;cursor:pointer}
.drawing{border:1px dashed var(--line);border-radius:14px;padding:20px;
  text-align:center;color:var(--soft);font-size:14px;margin-top:9px}

textarea{width:100%;font:inherit;font-size:20px;padding:15px;border-radius:16px;
  border:2px solid var(--line);background:var(--card);color:inherit;
  min-height:96px;resize:none;margin-bottom:13px}
textarea:focus{outline:none;border-color:var(--ink)}

.mic{width:100%;font:inherit;font-weight:800;font-size:20px;cursor:pointer;
  border:0;border-radius:18px;background:var(--coral);color:#fff;
  padding:24px;margin-bottom:13px;box-shadow:0 4px 0 #a63f2e}
.mic:active{transform:translateY(3px);box-shadow:0 1px 0 #a63f2e}
.mic.on{background:var(--leaf);box-shadow:0 4px 0 #1d6b41;animation:p 1.1s infinite}
.mic.blue{background:#3d7fd6;box-shadow:0 4px 0 #2a5c9c}
@keyframes p{50%{filter:brightness(1.18)}}

.next{width:100%;font:inherit;font-weight:800;font-size:19px;cursor:pointer;
  border:0;border-radius:18px;background:var(--leaf);color:#fff;padding:19px;
  box-shadow:0 4px 0 #1d6b41}
.next:active{transform:translateY(3px);box-shadow:0 1px 0 #1d6b41}

.quiet{background:none;border:0;color:var(--soft);font:inherit;font-size:14px;
  text-decoration:underline;cursor:pointer;padding:14px 0;display:block;
  margin:0 auto;text-align:center}

.say{font-size:14px;color:var(--soft);margin-bottom:11px}
.oops{background:#fdeceb;border-radius:12px;padding:11px;font-size:14px;margin-bottom:11px}

/* name picking */
.name{display:block;width:100%;text-align:left;cursor:pointer;background:var(--card);
  border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:12px;
  font:inherit;font-size:22px;font-weight:800;color:inherit;box-shadow:0 4px 0 var(--ink)}
.name:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
h2{font-size:25px;margin:28px 0 18px;font-weight:800;letter-spacing:-.02em}

.cover{background:var(--gold);border-radius:18px;padding:30px 20px;text-align:center;
  margin:20px 0 24px}
.cover h3{font-size:27px;margin:0 0 7px;font-weight:800}
.cover span{font-weight:700;color:#6b4a08}

/* grown-ups */
.gu{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:11px}
.gu h4{margin:0 0 9px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
.opt{display:flex;gap:7px}
.opt button{flex:1;font:inherit;font-weight:700;font-size:14px;padding:12px 6px;
  border:2px solid var(--line);border-radius:12px;background:var(--card);
  color:var(--soft);cursor:pointer}
.opt button.on{border-color:var(--ink);background:var(--ink);color:#fff}

#statusbar{position:fixed;left:0;right:0;bottom:0;z-index:99;background:#16233f;
  color:#fff;font:13px/1.4 ui-monospace,Menlo,monospace;padding:10px 14px;
  display:none;max-height:38vh;overflow:auto;white-space:pre-wrap}
#statusbar.bad{background:#8c2f26}
#statusbar b{color:#f5a524}

@media print{
  .prompt,.q,.mic,.next,.quiet,textarea,.redo,.drawing,.say,button{display:none!important}
  body{background:#fff}.wrap{max-width:none;padding:0}
  .page{page-break-inside:avoid;margin-bottom:30px}
  .page p{font-size:22px;text-align:center;margin-top:12px}
  .cover{page-break-after:always;background:none}
}
</style>
</head>

function tier(n){ return n===0?0 : n<=2?1 : n<=4?2 : 3; }

/* --- visible diagnostics: tells us exactly where things stop --- */
function status(msg, bad){
  var b=document.getElementById('statusbar');
  if(!b) return;
  b.style.display='block';
  b.className = bad ? 'bad' : '';
  b.innerHTML += (b.innerHTML?'\n':'') + msg;
  b.scrollTop = b.scrollHeight;
}
window.onerror=function(m,src,line){ status('<b>JS ERROR</b> line '+line+': '+m, 1); };
var $=function(i){return document.getElementById(i);};
var el=$('screen');

function save(k,v){try{localStorage.setItem('sq_'+k,JSON.stringify(v));}catch(e){}}
function load(k,d){try{var v=localStorage.getItem('sq_'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

function call(payload,ok,bad){
  fetch(scriptUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)})
  .then(function(r){return r.text();})
  .then(function(t){
    var d;
    try{ d=JSON.parse(t); }
    catch(e){ status('<b>REPLY WAS NOT JSON</b> first 200 chars:\n'+t.slice(0,200),1);
              bad('Something went wrong.'); return; }
    if(d&&d.ok) ok(d); else bad((d&&d.error)||'Something went wrong.');
  })
  .catch(function(err){ status('<b>NETWORK FAILED</b> '+err,1);
    bad('Could not connect. Check the wifi.'); });
}

/* ---------- listening ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition, rec=null;
var on=false, heard='', fLive, fDone, fBad;
function canHear(){return !!SR;}
function hear(live,done,bad){
  if(!SR){bad('This device cannot listen.');return;}
  heard=''; on=true; fLive=live; fDone=done; fBad=bad; spin();
}
function spin(){
  try{
    rec=new SR(); rec.lang='en-US'; rec.continuous=true; rec.interimResults=true;
    rec.onresult=function(e){
      var mid='';
      for(var i=e.resultIndex;i<e.results.length;i++){
        var t=e.results[i][0].transcript;
        if(e.results[i].isFinal) heard+=(heard?' ':'')+t.trim(); else mid+=t;
      }
      if(fLive) fLive(heard+(mid?(heard?' ':'')+mid:''));
    };
    rec.onerror=function(e){
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){
        on=false; fBad('The microphone is switched off. Ask a grown-up.');
      }
    };
    rec.onend=function(){ if(on){setTimeout(function(){if(on)spin();},250);} else if(fDone) fDone(heard); };
    rec.start();
  }catch(err){ on=false; fBad('The microphone would not start.'); }
}
function halt(){ on=false; if(rec){try{rec.stop();}catch(e){}} }
function speak(t){try{speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.05;speechSynthesis.speak(u);}catch(e){}}

/* ============================================================
   Who is writing
   ============================================================ */
function who(){
  S={pages:[],spelling:[],characters:'',starter:pick(STARTERS),
     mode:load('mode', canHear()?'talk':'type')};
  el.innerHTML='<h2>Who is writing?</h2>'+
    '<button class="name" onclick="go(\'Thomas\')">&#128994; Thomas</button>'+
    '<button class="name" onclick="go(\'Tori\')">&#128311; Tori</button>'+
    '<button class="quiet" onclick="grown()">Grown-ups</button>';
}
function go(w){ S.who=w; q=''; story(); }

/* ============================================================
   The whole app: prompt, pages, one question, one button
   ============================================================ */
function story(){
  if(!q){ q=pick(NUDGES[tier(S.pages.length)]); askNudge(); }

  el.innerHTML=
    '<div class="prompt" onclick="newPrompt()">Your story starts here'+
      '<b>'+esc(S.starter)+'</b></div>'+
    '<div id="pages">'+S.pages.map(pg).join('')+'</div>'+
    '<div class="q" onclick="newQ()"><em>Page '+(S.pages.length+1)+'</em>'+esc(q)+'</div>'+
    '<div id="box"></div>'+
    (S.pages.length?'<button class="quiet" onclick="done()">I have finished writing</button>':'')+
    '<button class="quiet" onclick="grown()">Grown-ups</button>';

  box();
}

function newPrompt(){
  if(S.pages.length) return;              // only before they have started
  S.starter=pick(STARTERS); story();
}
/* Asks the script for a question about THEIR story. Silent if it fails. */
var nudgeSeq=0;
function askNudge(){
  var mine=++nudgeSeq;
  var sofar=S.pages.map(function(x){return x.text;}).join(' ');
  call({action:'nudge',premise:S.starter,sofar:sofar,page:S.pages.length+1},
    function(d){
      if(mine!==nudgeSeq || !d.question) return;
      q=d.question;
      var box=document.querySelector('.q');
      if(box) box.innerHTML='<em>Page '+(S.pages.length+1)+'</em>'+esc(q);
    },
    function(){});
}

function newQ(){
  var t=NUDGES[tier(S.pages.length)], n=q, g=0;
  while(n===q&&g++<12) n=pick(t);
  q=n; story(); askNudge();
}

function pg(p,i){
  var art = p.drawing ? '<div class="drawing">&#127912; drawing this picture...</div>'
          : p.img ? '<img src="'+p.img+'" alt="">' : '';
  return '<div class="page"><p>'+esc(p.text)+'</p>'+art+
    (p.error?'<div class="oops">'+esc(p.error)+'</div>':'')+
    (p.drawing||!p.img?'':'<button class="redo" onclick="redo('+i+')">change my words</button>')+
    '</div>';
}
function repaint(i){
  var h=$('pages'); if(!h||!h.children[i])return;
  var t=document.createElement('div'); t.innerHTML=pg(S.pages[i],i);
  h.replaceChild(t.firstChild,h.children[i]);
}

/* one control: talk, or type. Set by a grown-up, never chosen by the child. */
function box(){
  var b=$('box');
  if(S.mode==='talk'){
    b.innerHTML='<button class="mic" id="m" onclick="talk()">&#127908; START talking</button>'+
      '<div id="say"></div>'+
      '<textarea id="e" placeholder="your words appear here" '+
        'autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>'+
      '<button class="next" onclick="add()">Next page &rarr;</button>';
  } else if(S.mode==='spell'){
    b.innerHTML='<button class="mic" id="m" onclick="sayFirst()">&#127908; START talking</button>'+
      '<div id="say"></div>';
  } else {
    b.innerHTML='<textarea id="e" placeholder="write what happens" '+
        'autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>'+
      '<div id="say"></div>'+
      '<button class="next" onclick="add()">Next page &rarr;</button>';
  }
}
function say(t,bad){var s=$('say'); if(s) s.innerHTML=t?'<div class="'+(bad?'oops':'say')+'">'+t+'</div>':'';}

var base='';
function talk(){
  var m=$('m');
  if(on){halt();return;}
  base=($('e').value||'').trim();
  m.classList.add('on'); m.innerHTML='&#9209;&#65039; STOP';
  say('Take as long as you like.');
  hear(function(l){ $('e').value=(base?base+' ':'')+l; },
       function(){ m.classList.remove('on'); m.innerHTML='&#127908; START talking'; say(''); },
       function(e){ m.classList.remove('on'); m.innerHTML='&#127908; START talking'; say(e,1); });
}

function sayFirst(){
  var m=$('m');
  if(on){halt();return;}
  m.classList.add('on'); m.innerHTML='&#9209;&#65039; STOP';
  say('Say your sentence, then tap STOP.');
  hear(function(l){ var n=l.trim()?l.trim().split(/\s+/).length:0;
        say('heard '+n+' word'+(n===1?'':'s')); },
    function(t){
      m.classList.remove('on'); m.innerHTML='&#127908; START talking';
      S.heard=(t||'').trim();
      if(!S.heard){say('I did not catch that.',1);return;}
      spellIt();
    },
    function(e){ m.classList.remove('on'); m.innerHTML='&#127908; START talking'; say(e,1); });
}
function spellIt(){
  var h=S.heard;
  $('box').innerHTML=
    '<button class="mic blue" onclick="speak(S.heard)">&#128266; play it again</button>'+
    '<textarea id="e" placeholder="type what you hear" autocapitalize="off" '+
      'autocorrect="off" spellcheck="false" autocomplete="off"></textarea>'+
    '<div id="say"></div>'+
    '<button class="next" onclick="add()">Next page &rarr;</button>';
  setTimeout(function(){speak(h);},350);
}

function add(){
  var b=$('e'); if(!b)return;
  var t=(b.value||'').trim();
  if(!t){say('write something first',1);return;}

  if(S.mode==='spell'&&S.heard){
    var a=S.heard.toLowerCase().replace(/[.,!?;:"']/g,'').split(/\s+/);
    var c=t.toLowerCase().replace(/[.,!?;:"']/g,'').split(/\s+/);
    a.forEach(function(w,i){ if(w) S.spelling.push({said:w,typed:c[i]||'',ok:(c[i]||'')===w}); });
    S.heard='';
  }

  S.pages.push({text:t,img:'',fileId:''});
  var i=S.pages.length-1;
  q=''; save('draft',S); story();
  var d=$('box'); if(d) d.scrollIntoView({block:'center'});
}

function redo(i){
  var p=S.pages[i];
  var t=prompt('Change your words and the picture will be drawn again.',p.text);
  if(t===null)return; t=t.trim(); if(!t)return;
  p.text=t; p.img=''; p.fileId=''; save('draft',S); story();
}


/* ---------- finishing ---------- */
function done(){
  halt();
  el.innerHTML='<h2>What is your book called?</h2>'+
    '<textarea id="t" style="min-height:64px" placeholder="my book is called..." '+
      'autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>'+
    '<div id="say"></div>'+
    '<button class="next" onclick="seal()">&#127912; Draw my story now!</button>'+
    '<button class="quiet" onclick="story()">keep writing</button>';
}
function seal(){
  var t=($('t').value||'').trim();
  if(!t){say('give it a title first',1);return;}
  S.title=t;
  drawAll();
}

/* 1. work out the cast  2. draw them together once  3. draw every page
   against that same picture, so nobody changes between pages. */
function drawAll(){
  var n=S.pages.length;
  if(!n){ sealDone(); return; }

  el.innerHTML='<div class="cover"><h3>'+esc(S.title)+'</h3>'+
    '<span>written by '+esc(S.who)+'</span></div>'+
    '<div id="pages">'+S.pages.map(pg).join('')+'</div>'+
    '<p id="prog" style="text-align:center;font-weight:800">Working out who is in your story...</p>';

  var whole=S.pages.map(function(x){return x.text;}).join(' ');
  var full=(S.starter?'The story began: '+S.starter+' ':'')+whole;

  call({action:'cast',premise:S.starter,story:'By '+S.who+'. '+whole},
    function(d){ withCast(d.cast||S.characters||''); },
    function(){ withCast(S.characters||''); });

  function withCast(cast){
    S.cast=cast;
    var pr=$('prog');
    if(pr) pr.textContent='Drawing your characters...';

    // one reference picture with the whole cast in it
    call({action:'illustrate',
          sentence:'All of these characters standing together in a row, facing forward, full body, plain background',
          characters:cast, premise:'', sofar:'', quality:'low'},
      function(r){ pages(cast, r.fileId||''); },
      function(){ pages(cast, ''); });
  }

  function pages(cast, refId){
    var done=0;
    var pr=$('prog');
    if(pr) pr.textContent='Drawing 0 of '+n+'...';

    function tick(){
      done++;
      var b=$('prog');
      if(b) b.textContent='Drawn '+done+' of '+n+'...';
      if(done>=n){ if(b) b.outerHTML=''; sealDone(); }
    }

    for(var i=0;i<n;i++){
      (function(i){
        var p=S.pages[i];
        p.drawing=true; repaint(i);
        call({action:'illustrate',sentence:p.text,characters:cast,
              premise:S.starter,sofar:full,ref:refId,quality:'low'},
          function(d){ p.drawing=false; p.img=d.url||('data:image/jpeg;base64,'+d.b64);
            p.fileId=d.fileId||''; save('draft',S); repaint(i); tick(); },
          function(e){ p.drawing=false; p.error=e; repaint(i); tick(); });
      })(i);
    }
  }
}

function sealDone(){
  var t=S.title;
  var g=load('gems',0)+5+S.pages.length; save('gems',g);
  var sh=load('shelf',[]);
  sh.unshift({title:t,who:S.who,when:Date.now(),pages:S.pages});
  save('shelf',sh.slice(0,40));
  call({action:'saveBook',who:S.who,title:t,mode:S.mode,pages:S.pages,spelling:S.spelling},
    function(){},function(){});
  try{localStorage.removeItem('sq_draft');}catch(e){}
  book(g);
}
function book(g){
  el.innerHTML='<div class="cover"><h3>'+esc(S.title)+'</h3>'+
    '<span>written by '+esc(S.who)+'</span></div>'+
    S.pages.map(function(p){return '<div class="page">'+
      (p.img?'<img src="'+p.img+'" alt="">':'')+'<p>'+esc(p.text)+'</p></div>';}).join('')+
    '<p style="text-align:center;font-weight:800">&#128142; '+g+' gems</p>'+
    '<button class="next" onclick="window.print()">&#128424; Print my book</button>'+
    '<button class="quiet" onclick="who()">write another</button>';
  window.scrollTo(0,0);
}

/* ---------- grown-ups ---------- */
function grown(){
  if(prompt('Grown-up code')!=='1921') return;
  var m=load('mode','talk'), sh=load('shelf',[]);
  el.innerHTML='<h2>Grown-ups</h2>'+
    '<div class="gu"><h4>How they write</h4><div class="opt">'+
      '<button class="'+(m==='talk'?'on':'')+'" onclick="setMode(\'talk\')">Talk it</button>'+
      '<button class="'+(m==='spell'?'on':'')+'" onclick="setMode(\'spell\')">Say &amp; spell</button>'+
      '<button class="'+(m==='type'?'on':'')+'" onclick="setMode(\'type\')">Type it</button>'+
    '</div></div>'+
    '<div class="gu"><h4>Script link</h4>'+
      '<div style="font-size:12px;margin-bottom:9px;color:var(--soft);word-break:break-all">'+
      esc(scriptUrl().slice(-28))+'</div>'+
      '<button class="next" style="font-size:15px;padding:12px" onclick="setUrl()">'+
      'Paste a new link</button></div>'+
    '<div class="gu"><h4>Characters</h4>'+
      '<div style="font-size:15px;margin-bottom:9px;color:var(--soft)">'+
      (S.characters?esc(S.characters):'Not set. Describing them keeps them looking the same in every picture.')+
      '</div>'+
      '<button class="next" style="font-size:15px;padding:12px" onclick="chars()">Describe them</button>'+
    '</div>'+
    '<div class="gu"><h4>'+sh.length+' book'+(sh.length===1?'':'s')+' saved here</h4>'+
      sh.map(function(b,i){return '<button class="quiet" style="text-align:left;margin:0" '+
        'onclick="open_('+i+')">'+esc(b.title)+' &middot; '+esc(b.who)+'</button>';}).join('')+
    '</div>'+
    '<button class="quiet" onclick="S.pages.length?story():who()">Back</button>';
}
function setMode(m){ save('mode',m); S.mode=m; grown(); }
function setUrl(){
  var v=prompt('Paste the /exec URL from Apps Script -> Manage deployments.', scriptUrl());
  if(v===null) return;
  v=v.trim();
  if(v.indexOf('/exec')===-1){ alert('That does not look right - it should end in /exec'); return; }
  save('url',v); grown();
}
function chars(){
  var v=prompt('Who is in the story? Their name and what they look like.',S.characters||'');
  if(v===null)return; S.characters=v.trim(); save('draft',S); grown();
}
function open_(i){ var b=load('shelf',[])[i]; S.title=b.title; S.who=b.who; S.pages=b.pages; book(load('gems',0)); }

/* ---------- start ---------- */
(function(){
  var d=load('draft',null);
  if(d&&d.pages&&d.pages.length){
    S=d; if(!S.starter)S.starter=pick(STARTERS); if(!S.mode)S.mode=load('mode','talk');
    el.innerHTML='<h2>'+esc(d.who)+', you have a book going</h2>'+
      '<button class="next" onclick="story()">Keep writing</button>'+
      '<button class="quiet" onclick="who()">Start a new one</button>';
  } else who();
})();
</script>
</body>
</html>
